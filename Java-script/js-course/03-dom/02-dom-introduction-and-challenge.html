<!-- ============================================================
     TOPIC: Introduction to the Document Object Model (DOM)
     + Solution to the DOM Challenge
     ============================================================
     The DOM is JavaScript's live, tree-like representation of
     your HTML page. It lets JS "see" and change elements on
     the page after it has loaded - e.g. changing text, hiding
     things, responding to clicks, etc.

     CHALLENGE (as commonly given in this lesson): when the
     button below is clicked, change the heading's text.
============================================================ -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>DOM Introduction & Challenge</title>
</head>
<body>

  <h1 id="main-heading">Original Heading</h1>
  <button id="change-btn">Click Me</button>

  <script src="./02-dom-introduction-and-challenge.js"></script>
</body>
</html>
